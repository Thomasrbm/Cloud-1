---
# group var s'applique auto dans les projet ansible sans avoir besoin de déclarer
# all s'applique à tout le monde 

# webservers que à la liste

# var use par les roles
project_dir: /opt/wordpress


swap_file: /swapfile
swap_size_mb: 2048
swap_swappiness: 10


# La liste part dans le .env (COMPOSE_FILE) : du coup un simple
# docker compose ps voit les 4 services d'un coup.
compose_files:
  - docker-compose.yml       # le socle : reseau + volumes  (role stack)
  - compose.db.yml           # MySQL                        (role db)
  - compose.wordpress.yml    # php-fpm + wp-cli             (role wordpress)
  - compose.phpmyadmin.yml   # phpMyAdmin                   (role phpmyadmin)
  - compose.proxy.yml        # nginx + TLS                  (role proxy)


wp_site_url: "https://{{ ansible_host }}"
wp_site_title: "Cloud-1"
wp_admin_user: thomas
wp_admin_email: admin@example.com
