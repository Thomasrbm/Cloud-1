---
# ==============================================================================
# PLAYBOOK DE DÉSINSTALLATION
#
# Remet le serveur dans son état d'origine pour pouvoir rejouer le déploiement
# complet devant un correcteur.
#
# Deux niveaux :
#   1) Standard  : supprime les conteneurs, les images et TOUTES les données
#                  (site, base MySQL, certificats). Docker reste installé.
#                  -> redéploiement en ~1 min
#      ansible-playbook teardown.yml --ask-vault-pass
#
#   2) Total     : en plus, désinstalle Docker, son dépôt apt, sa clé GPG et
#                  réinitialise le pare-feu. Le serveur redevient un Ubuntu nu.
#                  -> redéploiement complet, démo intégrale du playbook
#      ansible-playbook teardown.yml --ask-vault-pass -e full_wipe=true
#
# --ask-vault-pass est requis meme si ce playbook n'utilise aucun secret :
# il cible le groupe webservers, donc Ansible charge group_vars/webservers.yml,
# qui est chiffre. Sans le mot de passe il refuse de demarrer.
#
# ⚠️ DESTRUCTIF : toutes les données du site sont perdues (c'est le but).
# ==============================================================================

- name: Teardown WordPress stack
  hosts: webservers
  become: true

  vars:
    # Niveau 1 par défaut ; passe à true avec -e full_wipe=true
    full_wipe: false

  # Confirmation interactive. Sautée si la variable est fournie en ligne de
  # commande (ex : -e confirm=oui) pour un usage automatisé.
  vars_prompt:
    - name: confirm
      prompt: "Effacer la stack et TOUTES les donnees sur {{ ansible_play_hosts | join(', ') }} ? (tape: oui)"
      private: false

  tasks:

    # --------------------------------------------------------------------
    # Bloc 0 : garde-fous
    # --------------------------------------------------------------------
    - name: Abort unless explicitly confirmed
      assert:
        that:
          - confirm | lower in ['oui', 'yes', 'y']
        fail_msg: "Annulé : rien n'a été supprimé."
        quiet: true

    # Empêche un rm -rf catastrophique si project_dir est mal défini
    - name: Refuse to delete a dangerous path
      assert:
        that:
          - project_dir is defined
          - project_dir | length > 4
          - project_dir.startswith('/')
          - project_dir not in ['/', '/root', '/home', '/etc', '/var', '/usr', '/opt']
        fail_msg: "project_dir suspect ({{ project_dir | default('non défini') }}) : abandon."
        quiet: true

    - name: Check whether docker is installed
      command: docker --version
      register: docker_present
      changed_when: false
      failed_when: false

    # --------------------------------------------------------------------
    # Bloc 1 : arrêt et suppression des conteneurs
    # --------------------------------------------------------------------
    - name: Check for an existing compose file
      stat:
        path: "{{ project_dir }}/docker-compose.yml"
      register: compose_file

    - name: Stop and remove containers, networks and volumes
      # -v : supprime aussi les volumes docker ; --rmi all : et les images
      command: docker compose down -v --remove-orphans --rmi all
      args:
        chdir: "{{ project_dir }}"
      when:
        - compose_file.stat.exists
        - docker_present.rc == 0
      failed_when: false
      changed_when: true

    # --------------------------------------------------------------------
    # Bloc 2 : suppression des données
    #   - les volumes NOMMES (mysql_data, wp_data) sont supprimés par le -v
    #     du `docker compose down` ci-dessus ;
    #   - ce filet de sécurité les enlève même si le .env a disparu et que
    #     la commande précédente n'a pas pu s'exécuter.
    # --------------------------------------------------------------------
    - name: Remove the named volumes explicitly
      command: "docker volume rm {{ item }}"
      loop:
        - "{{ project_dir | basename }}_mysql_data"
        - "{{ project_dir | basename }}_wp_data"
      when: docker_present.rc == 0
      failed_when: false
      changed_when: true

    - name: Remove project directory (config, certificats, compose files)
      file:
        path: "{{ project_dir }}"
        state: absent

    # --------------------------------------------------------------------
    # Bloc 3 : nettoyage des restes Docker (images, cache de build, réseaux)
    # --------------------------------------------------------------------
    - name: Prune leftover docker data
      command: docker system prune -af --volumes
      when: docker_present.rc == 0
      failed_when: false
      changed_when: true

    # --------------------------------------------------------------------
    # Bloc 4 : désinstallation complète (uniquement si full_wipe=true)
    # --------------------------------------------------------------------
    - name: Full wipe
      when: full_wipe | bool
      block:

        - name: Stop docker service
          service:
            name: docker
            state: stopped
          failed_when: false

        - name: Uninstall Docker packages
          apt:
            name:
              - docker-ce
              - docker-ce-cli
              - containerd.io
              - docker-buildx-plugin
              - docker-compose-plugin
            state: absent
            purge: true
            autoremove: true

        - name: Remove docker apt repository and GPG key
          file:
            path: "{{ item }}"
            state: absent
          loop:
            - /etc/apt/sources.list.d/docker.list
            - /etc/apt/keyrings/docker.asc
            - /var/lib/docker
            - /var/lib/containerd

        - name: Refresh apt cache
          apt:
            update_cache: true

        - name: Reset firewall rules
          # Remet ufw à zéro : le rôle ufw les recréera au prochain déploiement.
          community.general.ufw:
            state: reset

    # --------------------------------------------------------------------
    # Bloc 5 : récapitulatif
    # --------------------------------------------------------------------
    - name: Summary
      debug:
        msg: >-
          Serveur nettoyé ({{ 'désinstallation TOTALE' if full_wipe | bool else 'stack + données' }}).
          Rejoue le déploiement avec : ansible-playbook playbook.yml --ask-vault-pass
