[webservers]
# Instance AWS EC2 (region eu-north-1, Ubuntu 22.04 LTS).
# ansible_user=ubuntu -> les AMI Ubuntu d'AWS interdisent le login root direct ;
#                        le playbook passe root via become, et le role ssh_access
#                        debloque ensuite `ssh root@<IP>`.
# Si tu arretes puis redemarres l'instance, l'IP publique change : remplace-la
# ici (ou attribue une Elastic IP pour la figer definitivement).
server1 ansible_host=13.60.218.238 ansible_user=ubuntu ansible_ssh_private_key_file=~/.ssh/cloud1-aws.pem

# Exemple VPS classique (root autorise) :
# server2 ansible_host=46.202.171.191 ansible_user=root ansible_ssh_private_key_file=~/.ssh/cloud1-aws.pem

# Pour deployer sur plusieurs serveurs en parallele, ajoute d'autres lignes (server2, server3...).


# configurations stocké dans vars pour tous les servers cibles de la liste
# il dit ou aller chercher le programme python sur chqaue server
[webservers:vars]
ansible_python_interpreter=/usr/bin/python3
