[webservers]
# Cible AWS EC2 : mets l'IP publique (ou l'Elastic IP) de ton instance.
# ansible_user=ubuntu  -> les AMI Ubuntu d'AWS interdisent le login root direct.
# ansible_ssh_private_key_file -> la clé .pem téléchargée à la création de l'instance.
server1 ansible_host=REMPLACE_PAR_IP_PUBLIQUE_EC2 ansible_user=ubuntu ansible_ssh_private_key_file=~/.ssh/cloud1-aws.pem

# Exemple VPS classique (root autorisé) :
# server1 ansible_host=46.202.171.191 ansible_user=root ansible_ssh_private_key_file=~/.ssh/id_ed25519

# Pour déployer sur plusieurs serveurs en parallèle, ajoute d'autres lignes (server2, server3...).


# configurations stocké dans vars pour tous les servers cibles de la liste
# il dit ou aller chercher le programme python sur chqaue server
[webservers:vars]
ansible_python_interpreter=/usr/bin/python3
