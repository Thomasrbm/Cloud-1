---
# ==============================================================================
# ROLE DB : MySQL, et rien d'autre.
# Deployable seul :  ansible-playbook playbook.yml --tags db --ask-vault-pass
# ==============================================================================

- name: Deploy the database compose file
  template:
    src: compose.db.yml.j2
    dest: "{{ project_dir }}/compose.db.yml"
    mode: '0644'

# -f explicite : ce role ne manipule que le socle + son propre composant.
- name: Start the database
  command: docker compose -f docker-compose.yml -f compose.db.yml up -d mysql
  args:
    chdir: "{{ project_dir }}"
  register: db_up
  # IDEMPOTENCE : "changed" seulement si Docker a reellement cree ou redemarre
  # le conteneur. Une stack deja en place affiche "Running" -> ok, pas changed.
  changed_when: >
    ('Started' in db_up.stderr) or ('Created' in db_up.stderr)
    or ('Recreated' in db_up.stderr)

# MySQL met 10 a 30 s a s'initialiser au premier demarrage (creation de la base
# et des comptes). mysqladmin est fourni par l'image elle-meme ; le mot de passe
# est lu DANS le conteneur, il n'apparait jamais dans la ligne de commande.
- name: Wait for MySQL to accept connections
  shell: >-
    docker compose -f docker-compose.yml -f compose.db.yml exec -T mysql
    sh -c 'mysqladmin ping -uroot -p"$MYSQL_ROOT_PASSWORD" --silent'
  args:
    chdir: "{{ project_dir }}"
  register: mysql_ping
  until: mysql_ping.rc == 0
  retries: 30
  delay: 5
  changed_when: false
  failed_when: false

- name: Fail with a clear message if MySQL never came up
  fail:
    msg: "MySQL n'a pas repondu en 150 s. Verifier : docker compose -f {{ project_dir }}/docker-compose.yml logs mysql"
  when: mysql_ping.rc != 0
