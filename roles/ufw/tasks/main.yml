---


# Bloc 1 : Installation
- name: Install ufw
  apt:
    name: ufw

# Bloc 2 : Les 3 exceptions
# (par defaut ufw bloque deja tout ce qui entre et laisse tout sortir)
- name: Allow SSH, HTTP, HTTPS
  # install en meme temps que ansible , fourre tout maintain par la commu (y a npm yarn etc.)
  community.general.ufw: # Module Ansible spécifique pour configurer UFW
    rule: allow          # exception
    port: "{{ item }}"   # var dynamique remplie en dessous
    proto: tcp
  loop:                  # boucle qui va remplir item et applique le allow en tcp
    - "22"               # ssh
    - "80"               # http
    - "443"              # tls https

# Bloc 3 : Activation finale du pare-feu
- name: Enable ufw
  community.general.ufw:
    state: enabled