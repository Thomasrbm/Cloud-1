---

# ==============================================================================
# RÔLE WORDPRESS

# Le runtime PHP (php-fpm) et l'installation du site par wp-cli.
# Les -f incluent compose.db.yml : le service wordpress declare depends_on mysql,
# et Compose refuse de demarrer si ce service manque dans le jeu de fichiers.
# ==============================================================================


# Bloc 1 : copie le compose de WordPress
- name: Deploy the WordPress compose file
  template:
    src: compose.wordpress.yml.j2
    dest: "{{ project_dir }}/compose.wordpress.yml"
    mode: '0644'


# Bloc 2 : lance ou maj le docker wordpress
- name: Start WordPress (php-fpm)
  command: >-
    docker compose -f docker-compose.yml -f compose.db.yml
    -f compose.wordpress.yml up -d wordpress
  args:
    chdir: "{{ project_dir }}"
  register: wp_up
  # Idem que pour la base : "changed" seulement si Docker a vraiment bougé.
  changed_when: >
    ('Started' in wp_up.stderr) or ('Created' in wp_up.stderr)
    or ('Recreated' in wp_up.stderr)


# Bloc 3 : attendre que l'image WordPress ait fini de copier ses fichiers
# Le volume étant nommé, on ne peut plus tester un chemin sur l'hôte : on
# regarde DEPUIS le conteneur.
- name: Wait for WordPress files to be extracted
  command: >-
    docker compose -f docker-compose.yml -f compose.db.yml
    -f compose.wordpress.yml exec -T wordpress
    sh -c "test -f /var/www/html/wp-includes/version.php"
  args:
    chdir: "{{ project_dir }}"
  register: wp_files
  until: wp_files.rc == 0
  retries: 30
  delay: 5
  changed_when: false
  failed_when: false


- name: Fail with a clear message if WordPress files never appeared
  fail:
    msg: "WordPress n'a pas fini de s'extraire. Verifier : docker compose logs wordpress"
  when: wp_files.rc != 0


# ==============================================================================
# INSTALLATION AUTOMATIQUE DE WORDPRESS (wp-cli)
# Le sujet exige un site fonctionnel obtenu UNIQUEMENT par le script : sans ces
# taches, chaque deploiement s'arrete sur le formulaire "Welcome" de WordPress,
# qu'il faudrait remplir a la main.
#
# On ecrit `wpcli wp core ...` et pas `wpcli core ...` : l'entrypoint de l'image
# ne rajoute `wp` que si le premier argument commence par un tiret, sinon il
# cherche un binaire nomme `core`, qui n'existe pas.
# ==============================================================================


# Bloc 4 : WordPress est-il deja installe ?
# 'core is-installed' renvoie 0 si oui, 1 sinon. C'est ce test qui rend la
# tache suivante idempotente : relancer le playbook ne reinstalle rien.
# wp-cli parle a MySQL via PHP, il n'a besoin d'aucun binaire client.
- name: Check whether WordPress is already installed
  command: >-
    docker compose -f docker-compose.yml -f compose.db.yml
    -f compose.wordpress.yml --profile tools run --rm -T wpcli wp core is-installed
  args:
    chdir: "{{ project_dir }}"
  register: wp_is_installed
  changed_when: false
  failed_when: false


# Bloc 5 : installation (titre, compte admin) - seulement si necessaire
- name: Install WordPress
  command: >-
    docker compose -f docker-compose.yml -f compose.db.yml
    -f compose.wordpress.yml --profile tools run --rm -T wpcli wp core install
    --url={{ wp_site_url }}
    --title={{ wp_site_title }}
    --admin_user={{ wp_admin_user }}
    --admin_password={{ wp_admin_password }}
    --admin_email={{ wp_admin_email }}
    --skip-email
  args:
    chdir: "{{ project_dir }}"
  when: wp_is_installed.rc != 0
  register: wp_install
  changed_when: wp_install.rc == 0
  # Rien n'est affiche quand la tache reussit ; en cas d'echec Ansible montre
  # la commande, mot de passe compris, ce qui est voulu ici pour pouvoir
  # diagnostiquer. Le mot de passe reste par ailleurs dans le vault.
