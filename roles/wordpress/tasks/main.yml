---
# ==============================================================================
# ROLE WORDPRESS : le runtime PHP + l'installation du site par wp-cli.
# Le sujet exige un site fonctionnel obtenu UNIQUEMENT par le script : sans les
# blocs wp-cli, chaque deploiement s'arreterait sur le formulaire "Welcome".
#
# -f inclut compose.db.yml car le service wordpress declare `depends_on: mysql`
# et Compose refuse de demarrer si le service cible est absent du jeu de fichiers.
# ==============================================================================

- name: Deploy the WordPress compose file
  template:
    src: compose.wordpress.yml.j2
    dest: "{{ project_dir }}/compose.wordpress.yml"
    mode: '0644'

- name: Start WordPress (php-fpm)
  command: >-
    docker compose -f docker-compose.yml -f compose.db.yml
    -f compose.wordpress.yml up -d wordpress
  args:
    chdir: "{{ project_dir }}"
  register: wp_up
  changed_when: >
    ('Started' in wp_up.stderr) or ('Created' in wp_up.stderr)
    or ('Recreated' in wp_up.stderr)

# Au tout premier lancement, l'image recopie WordPress dans le volume wp_data.
# On attend la fin de la copie ; le volume etant nomme, on teste DEPUIS le
# conteneur et non par un chemin sur l'hote.
- name: Wait for WordPress files to be extracted
  command: >-
    docker compose -f docker-compose.yml -f compose.db.yml
    -f compose.wordpress.yml exec -T wordpress
    sh -c "test -f /var/www/html/wp-includes/version.php"
  args:
    chdir: "{{ project_dir }}"
  register: wp_files
  until: wp_files.rc == 0
  retries: 30
  delay: 5
  changed_when: false
  failed_when: false

- name: Fail with a clear message if WordPress files never appeared
  fail:
    msg: "WordPress n'a pas fini de s'extraire. Verifier : docker compose logs wordpress"
  when: wp_files.rc != 0

# On appelle explicitement `wp` : l'entrypoint de l'image wordpress:cli ne
# prefixe la commande par `wp` que si le premier argument commence par un
# tiret. Sans lui, il tente d'executer le binaire `core`, qui n'existe pas.
#
# 'core is-installed' renvoie 0 si oui, 1 sinon : c'est ce test qui rend
# l'installation idempotente. Relancer le playbook ne reinstalle rien.
- name: Check whether WordPress is already installed
  command: >-
    docker compose -f docker-compose.yml -f compose.db.yml
    -f compose.wordpress.yml --profile tools run --rm -T wpcli wp core is-installed
  args:
    chdir: "{{ project_dir }}"
  register: wp_is_installed
  changed_when: false
  failed_when: false

- name: Install WordPress
  command: >-
    docker compose -f docker-compose.yml -f compose.db.yml
    -f compose.wordpress.yml --profile tools run --rm -T wpcli wp core install
    --url={{ wp_site_url }}
    --title={{ wp_site_title }}
    --admin_user={{ wp_admin_user }}
    --admin_password={{ wp_admin_password }}
    --admin_email={{ wp_admin_email }}
    --skip-email
  args:
    chdir: "{{ project_dir }}"
  when: wp_is_installed.rc != 0
  register: wp_install
  changed_when: wp_install.rc == 0
