---

# ==============================================================================
# RÔLE PRINCIPAL D'APPLICATION (APP)

# MySQL (Base de données), WordPress (Site), phpMyAdmin (Gestion) et Nginx (Proxy/TLS).
# ==============================================================================


# Bloc 1 : arborescence
- name: Create project directories
  file: # Module 'file' pour créer des structures de dossiers
    path: "{{ item }}"   # Variable dynamique qui prend chaque ligne de la boucle ci-dessous
    state: directory     # On demande la création de dossiers
    mode: '0755'         # Permissions standard (root modifie, les autres lisent et entrent)
  
  # project_dir defini dans groups_var, all.yaml
  loop:
    - "{{ project_dir }}"
    - "{{ project_dir }}/mysql"   # Volume pour db (survie reboot)
    - "{{ project_dir }}/wp"      # Volume pour fichier site (images, thèmes...)
    - "{{ project_dir }}/nginx"
    - "{{ project_dir }}/ssl"     # certificats




# Bloc 2 : Génération auto certif TLS (HTTPS)
- name: Generate self-signed SSL certificate
  # > : colle tout et add un \n
  command: >
    openssl req -x509 -nodes -days 365 -newkey rsa:2048
    -keyout {{ project_dir }}/ssl/key.pem
    -out {{ project_dir }}/ssl/cert.pem
    -subj "/C=FR/ST=LeHavre/L=LeHavre/O=42/CN={{ domain_name }}"
  args:  # control en + sur une cmd
    creates: "{{ project_dir }}/ssl/cert.pem" # si existe deja, refait pas la commande



# Bloc 3 : ngninx
- name: Deploy nginx config
  template: # Le module 'template' prend un modèle (.j2), remplace les variables et copie le fichier
    src: nginx.conf.j2                     # Le fichier modèle sur ton ordinateur personnel
    dest: "{{ project_dir }}/nginx/nginx.conf" # La destination sur le serveur distant
    mode: '0644'
  notify: Restart stack # Si la config change, Ansible appellera un "handler" pour redémarrer l'app





# Bloc 4 : le .env
- name: Deploy .env file (secrets)
  template:
    src: env.j2
    dest: "{{ project_dir }}/.env"
    mode: '0600' # perm admin only 
  notify: Restart stack





# Bloc 5 : copie le compose
- name: Deploy docker-compose.yml
  template:
    src: docker-compose.yml.j2
    dest: "{{ project_dir }}/docker-compose.yml"
    mode: '0644'
  notify: Restart stack



# Bloc 6 : lance ou maj des docker
- name: Start the stack
  command: docker compose up -d --remove-orphans
  args:
    chdir: "{{ project_dir }}"
  register: compose_up # Enregistre le texte de réponse du terminal dans une variable nommée 'compose_up'

    # IDEMPOTENCE : Ansible considère par défaut qu'une tâche 'command' modifie TOUJOURS le serveur.

    # Grâce à cette condition, Ansible dira "changed" (modifié) uniquement si Docker a réellement créé,
    # démarré ou recréé un conteneur. 
    
    #Si tout tourne déjà parfaitement, il affichera juste "ok" (aucun changement).
  changed_when: >
    ('Started' in compose_up.stderr) or ('Created' in compose_up.stderr)
    or ('Recreated' in compose_up.stderr)


# ==============================================================================
# INSTALLATION AUTOMATIQUE DE WORDPRESS (wp-cli)
# Le sujet exige un site fonctionnel obtenu UNIQUEMENT par le script : sans ces
# taches, chaque deploiement s'arrete sur le formulaire "Welcome" de WordPress,
# qu'il faudrait remplir a la main.
# ==============================================================================


# Bloc 7 : attendre que l'image WordPress ait fini de copier ses fichiers
- name: Wait for WordPress files to be extracted
  wait_for:
    path: "{{ project_dir }}/wp/wp-includes/version.php"
    timeout: 300



# Bloc 8 : attendre que MySQL accepte les connexions
# MySQL met 10 a 30 s a s'initialiser au tout premier demarrage (creation de la
# base et des comptes). On interroge le serveur avec mysqladmin, fourni par
# l'image mysql elle-meme. Le mot de passe est lu DANS le conteneur depuis sa
# variable d'environnement : il n'apparait jamais dans la ligne de commande.
- name: Wait for MySQL to accept connections
  shell: >-
    docker compose exec -T mysql
    sh -c 'mysqladmin ping -uroot -p"$MYSQL_ROOT_PASSWORD" --silent'
  args:
    chdir: "{{ project_dir }}"
  register: mysql_ping
  until: mysql_ping.rc == 0
  retries: 30
  delay: 5
  changed_when: false
  failed_when: false


- name: Fail with a clear message if MySQL never came up
  fail:
    msg: "MySQL n'a pas repondu en 150 s. Verifier : docker compose -f {{ project_dir }}/docker-compose.yml logs mysql"
  when: mysql_ping.rc != 0



# Bloc 9 : WordPress est-il deja installe ?
# 'core is-installed' renvoie 0 si oui, 1 sinon. C'est ce test qui rend la
# tache suivante idempotente : relancer le playbook ne reinstalle rien.
# wp-cli parle a MySQL via PHP, il n'a besoin d'aucun binaire client.
- name: Check whether WordPress is already installed
  command: docker compose --profile tools run --rm -T wpcli core is-installed
  args:
    chdir: "{{ project_dir }}"
  register: wp_is_installed
  changed_when: false
  failed_when: false



# Bloc 10 : installation (titre, compte admin) - seulement si necessaire
- name: Install WordPress
  command: >
    docker compose --profile tools run --rm -T wpcli core install
    --url={{ wp_site_url }}
    --title={{ wp_site_title }}
    --admin_user={{ wp_admin_user }}
    --admin_password={{ wp_admin_password }}
    --admin_email={{ wp_admin_email }}
    --skip-email
  args:
    chdir: "{{ project_dir }}"
  when: wp_is_installed.rc != 0
  register: wp_install
  changed_when: wp_install.rc == 0
  # Rien n'est affiche quand la tache reussit ; en cas d'echec Ansible montre
  # la commande, mot de passe compris, ce qui est voulu ici pour pouvoir
  # diagnostiquer. Le mot de passe reste par ailleurs dans le vault.
