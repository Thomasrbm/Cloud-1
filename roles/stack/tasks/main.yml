---

# ==============================================================================
# RÔLE SOCLE (STACK)

# Le dossier du projet, les secrets et le réseau. Aucun conteneur applicatif ici :
# db, wordpress, phpmyadmin et proxy viennent se brancher dessus juste après.
# ==============================================================================


# Bloc 1 : arborescence
- name: Create project directory
  file:
    path: "{{ project_dir }}"   # project_dir defini dans groups_var, all.yaml
    state: directory            # On demande la création d'un dossier
    mode: '0755'                # Permissions standard (root modifie, les autres lisent et entrent)


# Bloc 2 : le .env
# Il doit exister AVANT le premier docker compose : c'est lui qui donne les mots
# de passe et la liste des fichiers compose à fusionner.
- name: Deploy .env file (secrets)
  # va chercher dans le template du  /stack
  template:
    src: env.j2
    dest: "{{ project_dir }}/.env"
    mode: '0600' # perm admin only
  notify: Recreate stack  # se declahcne quand sont cree ou modif :  /opt/wordpress/.env et /opt/wordpress/docker-compose.yml


# Bloc 3 : copie le compose de base
- name: Deploy base compose file (network and named volumes)
  template: # Le module 'template' prend un modèle (.j2), remplace les variables et copie le fichier
    src: docker-compose.yml.j2                 # Le fichier modèle sur ton ordinateur personnel
    dest: "{{ project_dir }}/docker-compose.yml" # La destination sur le serveur distant
    mode: '0644'
  notify: Recreate stack # Si la config change, Ansible appellera un "handler" pour redémarrer l'app
