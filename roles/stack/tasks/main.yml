---
# ==============================================================================
# ROLE STACK : le socle commun, rien d'applicatif.
#   - le dossier projet
#   - le .env (secrets + liste des fichiers compose)
#   - le fichier compose de base (reseau + volumes nommes)
# Les roles db / wordpress / phpmyadmin / proxy viennent ensuite s'y brancher.
# ==============================================================================

- name: Create project directory
  file:
    path: "{{ project_dir }}"
    state: directory
    mode: '0755'

# Le .env doit exister AVANT le premier `docker compose` : c'est lui qui fournit
# les mots de passe et la liste COMPOSE_FILE.
- name: Deploy .env file (secrets)
  template:
    src: env.j2
    dest: "{{ project_dir }}/.env"
    mode: '0600'   # lisible par root uniquement
  notify: Recreate stack

- name: Deploy base compose file (network and named volumes)
  template:
    src: docker-compose.yml.j2
    dest: "{{ project_dir }}/docker-compose.yml"
    mode: '0644'
  notify: Recreate stack
