---

# ==============================================================================
# RÔLE REVERSE-PROXY (PROXY)

# nginx et le TLS : le seul composant exposé sur Internet (80 et 443).
# C'est aussi le dernier rôle du playbook, donc c'est lui qui fait la passe
# finale sur toute la stack.
# ==============================================================================


# Bloc 1 : arborescence
- name: Create nginx and ssl directories
  file:
    path: "{{ item }}"
    state: directory
    mode: '0755'
  loop:
    - "{{ project_dir }}/nginx"
    - "{{ project_dir }}/ssl"     # certificats


# Bloc 2 : Génération auto certif TLS (HTTPS)
- name: Generate self-signed SSL certificate
  # > : colle tout et add un \n
  command: >
    openssl req -x509 -nodes -days 365 -newkey rsa:2048
    -keyout {{ project_dir }}/ssl/key.pem
    -out {{ project_dir }}/ssl/cert.pem
    -subj "/C=FR/ST=LeHavre/L=LeHavre/O=42/CN={{ domain_name }}"
  args:  # control en + sur une cmd
    creates: "{{ project_dir }}/ssl/cert.pem" # si existe deja, refait pas la commande


# Bloc 3 : ngninx
- name: Deploy nginx config
  template: # Le module 'template' prend un modèle (.j2), remplace les variables et copie le fichier
    src: nginx.conf.j2                     # Le fichier modèle sur ton ordinateur personnel
    dest: "{{ project_dir }}/nginx/nginx.conf" # La destination sur le serveur distant
    mode: '0644'
  notify: Restart nginx # Si la config change, Ansible appellera un "handler" pour relancer nginx


# Bloc 4 : copie le compose du proxy
- name: Deploy the proxy compose file
  template:
    src: compose.proxy.yml.j2
    dest: "{{ project_dir }}/compose.proxy.yml"
    mode: '0644'


# Bloc 5 : lance ou maj le docker nginx
- name: Start nginx
  command: docker compose up -d nginx
  args:
    chdir: "{{ project_dir }}"
  register: nginx_up
  changed_when: >
    ('Started' in nginx_up.stderr) or ('Created' in nginx_up.stderr)
    or ('Recreated' in nginx_up.stderr)


# Bloc 6 : passe finale sur toute la stack
# Une commande nue : elle lit COMPOSE_FILE dans le .env, donc elle voit les 4
# services d'un coup. Ça vérifie qu'ils correspondent bien aux fichiers compose
# et ça vire les conteneurs orphelins.
- name: Converge the whole stack
  command: docker compose up -d --remove-orphans
  args:
    chdir: "{{ project_dir }}"
  register: stack_up
  changed_when: >
    ('Started' in stack_up.stderr) or ('Created' in stack_up.stderr)
    or ('Recreated' in stack_up.stderr)
