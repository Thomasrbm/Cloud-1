# fichier de config pour la commande ansible-playbook

[defaults]
# Indique à Ansible où se trouve la liste des serveurs cibles (l'inventaire).
inventory = inventory.ini

# Utilisateur SSH par défaut (surchargé par ansible_user dans inventory.ini).
# Sur AWS EC2 / Ubuntu, c'est "ubuntu" : le login root direct est interdit.
remote_user = root

# Clé privée par défaut (surchargée par ansible_ssh_private_key_file dans inventory.ini).
# Sur AWS : la clé .pem de la key pair EC2, en chmod 400.
private_key_file = ~/.ssh/cloud1-aws.pem

# Désactive la vérification manuelle de la clé de l'hôte lors de la première connexion.
# Évite que le script ne se bloque en attendant que tu tapes "yes" dans le terminal.
host_key_checking = False

[ssh_connection]
# Envoie le module Python directement dans la session SSH au lieu de le
# televerser en sftp puis de l'executer : 1 aller-retour au lieu de 4 par
# tache. C'est 2 a 3x plus rapide, surtout depuis un portable en WiFi.
# (Necessite que le serveur n'exige pas de tty pour sudo : OK sur Ubuntu.)
pipelining = True

# Garde la connexion SSH ouverte 5 min entre deux taches plutot que de la
# rouvrir sans arret. ControlPath court : le chemin du socket est limite a
# 108 caracteres par le noyau.
ssh_args = -C -o ControlMaster=auto -o ControlPersist=300s
