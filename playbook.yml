---
# Fichier principal d'orchestration pour le projet
- name: Deploy WordPress stack
  # la cible ( list defini dans inventory.ini )
  hosts: webservers
  # execute les opération en root sur les servers
  become: true # Requis pour installer des paquets et modifier le pare-feu


  # va chercher dans le dossier roles puis task et executer le main de chaque
  # sous dossier role/task.
  # Les 4 premiers préparent la machine, les 5 suivants sont un composant
  # chacun : une partie se déploie toute seule avec --tags.
  #   ansible-playbook playbook.yml --tags db --ask-vault-pass
  roles:
    # --- on prépare la machine -----------------------------------------------
    # 0. Autorise les clés publiques des autres machines (portable, poste 42)
    - { role: ssh_access, tags: ['ssh'] }

    # 1. Ajoute un fichier d'échange (1 Go de RAM sur l'EC2, aucun swap fourni)
    - { role: swap,       tags: ['swap', 'system'] }

    # 2. Prépare la machine en installant le moteur Docker
    - { role: docker,     tags: ['docker'] }

    # 3. Sécurise le serveur en fermant les ports inutiles (seuls accessible : 22, 80, 443)
    - { role: ufw,        tags: ['ufw', 'security'] }

    # --- un rôle = un composant de la stack ----------------------------------
    # 4. Le socle : dossier du projet, .env (secrets), réseau et volumes
    - { role: stack,      tags: ['stack'] }

    # 5. La base de données MySQL (aucun port publié)
    - { role: db,         tags: ['db'] }

    # 6. WordPress en php-fpm + l'installation du site par wp-cli
    - { role: wordpress,  tags: ['wordpress', 'wp'] }

    # 7. L'interface d'administration de la base
    - { role: phpmyadmin, tags: ['phpmyadmin', 'pma'] }

    # 8. nginx et le TLS : le seul composant exposé sur Internet
    - { role: proxy,      tags: ['proxy', 'nginx'] }
